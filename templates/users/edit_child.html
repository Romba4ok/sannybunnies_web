<!doctype html>
<html lang="ru" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Редактировать ребенка</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  </head>
  <body class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="form-box">
      <h1 class="h3 text-center mb-4">Редактировать ребенка</h1>
      {% with messages = get_flashed_messages(category_filter=['error']) %}
        {% if messages %}
          <div class="alert alert-danger">{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}
      <form method="post" action="{{ url_for('users.edit_child', child_id=child.id) }}" enctype="multipart/form-data">
        <div class="mb-3">
          <label for="name" class="form-label">Имя ребенка</label>
          <input type="text" class="form-control" id="name" name="name" value="{{ child.name }}" required />
        </div>
        <div class="mb-3">
          <label for="birth_date" class="form-label">Дата рождения</label>
          <input type="text" class="form-control" id="birth_date" name="birth_date" value="{{ child.birthDate }}" placeholder="ДД.ММ.ГГГГ" />
        </div>
        <div class="mb-3">
          <label for="gender" class="form-label">Пол</label>
          <select class="form-select" id="gender" name="gender">
            <option value="Мужской" {% if child.gender == 'Мужской' %}selected{% endif %}>Мужской</option>
            <option value="Женский" {% if child.gender == 'Женский' %}selected{% endif %}>Женский</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="group_id" class="form-label">Группа</label>
          <select class="form-select" id="group_id" name="group_id">
            <option value="">Нет группы</option>
            {% for group in groups %}
              <option value="{{ group.id }}" {% if child.group_id == group.id %}selected{% endif %}>{{ group.name or group.id }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="mb-3">
          <label for="health_text" class="form-label">Здоровье</label>
          <textarea class="form-control" id="health_text" name="health_text" rows="2">{{ child.healthText }}</textarea>
        </div>
        <div class="mb-3">
          <label for="mood" class="form-label">Настроение</label>
          <input type="text" class="form-control" id="mood" name="mood" value="{{ child.mood }}" />
        </div>
        <div class="mb-3">
          <label for="features" class="form-label">Особенности</label>
          <textarea class="form-control" id="features" name="features" rows="3" placeholder="Введите особенности через запятую">{{ child.features | join(', ') if child.features else '' }}</textarea>
          <div class="form-text">Разделяйте особенности запятой.</div>
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="in_kindergarten" name="in_kindergarten" {% if child.inKindergarten %}checked{% endif %} />
          <label class="form-check-label" for="in_kindergarten">В детском саду</label>
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="request_status" name="request_status" {% if child.requestStatus %}checked{% endif %} />
          <label class="form-check-label" for="request_status">Статус запроса</label>
        </div>
        <div class="mb-3">
          <label for="photo" class="form-label">Фото</label>
          <input type="file" class="form-control" id="photo" name="photo" accept="image/*" />
          {% if child.photoUrl %}
            <div class="mt-2">
              <img src="{{ child.photoUrl }}" alt="Фото ребенка" class="preview-photo" />
            </div>
          {% endif %}
        </div>
        <div class="d-flex gap-2 justify-content-end">
          <a href="{{ url_for('users.index') }}" class="btn btn-secondary">Отмена</a>
          <button type="submit" class="btn btn-primary">Сохранить</button>
        </div>
      </form>
    </div>
  </body>
</html>
