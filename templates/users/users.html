{% extends 'layout.html' %}

{% block content %}
  <div class="row align-items-center mb-4 g-3">
    <div class="col-md-8">
      <h1 class="h3 mb-0 text-white fw-bold">Пользователи</h1>
      <p class="text-muted mb-0">Добавляйте администраторов, воспитателей и родителей, а детей просматривайте прямо под профилями родителей.</p>
    </div>
    <div class="col-md-4 d-flex justify-content-md-end justify-content-start">
      <div class="users-total" id="usersTotal">
        <span>...</span>
        <small>загрузка</small>
      </div>
    </div>
  </div>

  <form method="post" action="{{ url_for('users.add') }}" enctype="multipart/form-data" class="users-create-panel">
    <div class="users-create-panel__head">
      <div>
        <span class="users-label">Новый профиль</span>
        <h2>Добавить пользователя</h2>
      </div>
      <button type="submit" class="btn btn-primary">Добавить</button>
    </div>

    <div class="users-create-grid">
      <div class="users-field">
        <label for="name" class="form-label">Имя</label>
        <input type="text" class="form-control" id="name" name="name" placeholder="Имя" required />
      </div>
      <div class="users-field">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="Email" required />
      </div>
      <div class="users-field">
        <label for="phone" class="form-label">Телефон</label>
        <input type="tel" class="form-control" id="phone" name="phone" placeholder="+7 (XXX) XXX XX XX" />
      </div>
      <div class="users-field">
        <label for="role" class="form-label">Роль</label>
        <select class="form-select" id="role" name="role">
          <option value="user">user</option>
          <option value="teacher">teacher</option>
          <option value="admin">admin</option>
        </select>
      </div>
      <div class="users-field">
        <label for="password" class="form-label">Пароль</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="Пароль" required />
      </div>
      <div class="users-field">
        <label for="photo" class="form-label">Аватарка</label>
        <div class="custom-file custom-file--small">
          <button type="button" class="custom-file__button" onclick="document.getElementById('photo').click()">Выбрать файл</button>
          <span class="custom-file__label" id="photo-filename">Нет файла</span>
          <input type="file" id="photo" name="photo" accept="image/*" />
        </div>
      </div>
    </div>
  </form>

  <div id="usersClient" class="users-client">
    <div class="users-filter-panel">
      <div class="users-filter-field">
        <label for="usersSearch" class="form-label">Поиск</label>
        <input type="search" class="form-control" id="usersSearch" placeholder="Имя, email, телефон, ребенок..." />
      </div>
      <div class="users-filter-field users-filter-field--role">
        <label for="usersRoleFilter" class="form-label">Роль</label>
        <select class="form-select" id="usersRoleFilter">
          <option value="all">Все</option>
          <option value="admin">Админы</option>
          <option value="teacher">Воспитатели</option>
          <option value="parent">Родители</option>
        </select>
      </div>
    </div>
    <div class="users-loader" id="usersLoader">Загрузка пользователей...</div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function(){
      var fileInput = document.getElementById('photo');
      var label = document.getElementById('photo-filename');
      if(fileInput && label){
        fileInput.addEventListener('change', function(){
          var name = fileInput.files && fileInput.files.length ? fileInput.files[0].name : 'Нет файла';
          label.textContent = name;
        });
      }
    });

    (function(){
      var container = document.getElementById('usersClient');
      var loader = document.getElementById('usersLoader');
      var total = document.getElementById('usersTotal');
      var searchInput = document.getElementById('usersSearch');
      var roleFilter = document.getElementById('usersRoleFilter');
      var loadedData = null;
      var loadedChildrenByParent = {};

      function el(tag, cls, text){
        var node = document.createElement(tag);
        if(cls) node.className = cls;
        if(text !== undefined) node.textContent = text;
        return node;
      }

      function roleLabel(role){
        if(role === 'admin') return 'Админ';
        if(role === 'teacher') return 'Воспитатель';
        return 'Родитель';
      }

      function normalize(value){
        return String(value || '').toLowerCase().trim();
      }

      function childMatches(child, query){
        if(!query) return true;
        return [
          child.name,
          child.birthDate,
          child.gender
        ].some(function(value){ return normalize(value).indexOf(query) !== -1; });
      }

      function userMatches(user, query, childrenByParent){
        if(!query) return true;
        var ownMatch = [
          user.name,
          user.email,
          user.phone,
          user.role,
          user.id
        ].some(function(value){ return normalize(value).indexOf(query) !== -1; });
        if(ownMatch) return true;
        return (childrenByParent[user.id] || []).some(function(child){ return childMatches(child, query); });
      }

      function avatar(name, photoUrl, cls){
        var wrap = el('div', cls || 'user-avatar');
        if(photoUrl){
          var img = el('img');
          img.src = photoUrl;
          img.alt = 'Аватар';
          wrap.appendChild(img);
        } else {
          wrap.appendChild(el('span', '', (name || '?').slice(0, 1)));
        }
        return wrap;
      }

      function infoItem(label, value){
        var box = el('div', 'user-info-item');
        box.appendChild(el('span', '', label));
        box.appendChild(el('strong', '', value || '-'));
        return box;
      }

      function renderChild(child){
        var card = el('article', 'user-child-card');
        card.appendChild(avatar(child.name, child.photoUrl, 'user-child-avatar'));

        var body = el('div', 'user-child-body');
        body.appendChild(el('strong', '', child.name || 'Ребенок'));
        body.appendChild(el('span', '', (child.birthDate || '-') + ' | ' + (child.gender || '-')));
        card.appendChild(body);

        var action = el('a', 'btn btn-sm btn-outline-light user-btn-edit', 'Редактировать');
        action.href = '/users/edit_child/' + child.id;
        card.appendChild(action);
        return card;
      }

      function renderUser(user, childrenByParent){
        var card = el('article', 'user-profile-card');
        var head = el('div', 'user-profile-head');
        head.appendChild(avatar(user.name, user.photo_url, 'user-avatar'));

        var title = el('div', 'user-profile-title');
        title.appendChild(el('span', 'users-label', roleLabel(user.role)));
        title.appendChild(el('h2', '', user.name || 'Без имени'));
        title.appendChild(el('small', '', 'ID: ' + (user.id || '-')));
        head.appendChild(title);

        var badge = el('div', 'user-role-badge', user.role || 'user');
        head.appendChild(badge);
        card.appendChild(head);

        var grid = el('div', 'user-info-grid');
        grid.appendChild(infoItem('Email', user.email || '-'));
        grid.appendChild(infoItem('Телефон', user.phone || '-'));
        card.appendChild(grid);

        var actions = el('div', 'user-profile-actions');
        var edit = el('a', 'btn btn-sm btn-outline-light user-btn-edit', 'Редактировать');
        edit.href = '/users/edit/' + user.id;
        actions.appendChild(edit);
        var form = el('form', 'm-0');
        form.method = 'post';
        form.action = '/users/delete/' + user.id;
        form.onsubmit = function(e){ e.stopPropagation(); return confirm('Удалить пользователя?'); };
        var del = el('button', 'btn btn-sm btn-outline-danger user-btn-delete', 'Удалить');
        del.type = 'submit';
        form.appendChild(del);
        actions.appendChild(form);
        card.appendChild(actions);

        var children = childrenByParent[user.id] || [];
        if(children.length){
          var childWrap = el('div', 'user-children-block');
          var childHead = el('div', 'user-children-head');
          childHead.appendChild(el('span', '', 'Дети'));
          childHead.appendChild(el('strong', '', String(children.length)));
          childWrap.appendChild(childHead);
          children.forEach(function(child){ childWrap.appendChild(renderChild(child)); });
          card.appendChild(childWrap);
        }

        return card;
      }

      function renderSection(title, users, childrenByParent){
        if(!users || !users.length) return null;
        var section = el('section', 'users-section');
        var head = el('div', 'users-section__head');
        head.appendChild(el('h2', '', title));
        head.appendChild(el('span', '', String(users.length)));
        section.appendChild(head);
        var grid = el('div', 'users-grid');
        users.forEach(function(user){ grid.appendChild(renderUser(user, childrenByParent)); });
        section.appendChild(grid);
        return section;
      }

      function visibleUsers(users, role, query, childrenByParent){
        if(!users) return [];
        return users.filter(function(user){
          return (!role || role === 'all' || role === 'parent' || user.role === role) && userMatches(user, query, childrenByParent);
        });
      }

      function removeRenderedSections(){
        Array.from(container.querySelectorAll('.users-section, .users-empty')).forEach(function(node){ node.remove(); });
      }

      function renderAll(){
        if(!loadedData) return;
        removeRenderedSections();
        var query = normalize(searchInput && searchInput.value);
        var selectedRole = roleFilter ? roleFilter.value : 'all';
        var sections = [
          ['Админы', 'admin', loadedData.admins || []],
          ['Воспитатели', 'teacher', loadedData.teachers || []],
          ['Родители', 'parent', loadedData.parents || []]
        ];
        var visibleCount = 0;

        sections.forEach(function(sectionData){
          var title = sectionData[0];
          var role = sectionData[1];
          var users = selectedRole === 'all' || selectedRole === role
            ? visibleUsers(sectionData[2], role, query, loadedChildrenByParent)
            : [];
          visibleCount += users.length;
          var section = renderSection(title, users, loadedChildrenByParent);
          if(section) container.appendChild(section);
        });

        if(total){
          total.innerHTML = '';
          total.appendChild(el('span', '', String(visibleCount)));
          total.appendChild(el('small', '', query || selectedRole !== 'all' ? 'найдено' : 'пользователей'));
        }

        if(!container.querySelector('.users-section')){
          container.appendChild(el('div', 'users-empty', 'Пользователи не найдены.'));
        }
      }

      fetch(window.location.pathname.replace(/\/$/, '') + '/data', { credentials: 'same-origin', headers: {'X-Requested-With':'fetch'} })
        .then(function(response){ if(!response.ok) throw new Error(); return response.json(); })
        .then(function(data){
          loader.remove();
          var children = data.children || [];
          var childrenByParent = {};
          children.forEach(function(child){
            var parentId = child.parent_id;
            if(!parentId) return;
            (childrenByParent[parentId] = childrenByParent[parentId] || []).push(child);
          });

          loadedData = data;
          loadedChildrenByParent = childrenByParent;
          renderAll();
        })
        .catch(function(){
          loader.textContent = 'Не удалось загрузить пользователей. Перезагрузите страницу.';
        });

      if(searchInput) searchInput.addEventListener('input', renderAll);
      if(roleFilter) roleFilter.addEventListener('change', renderAll);
    })();
  </script>
{% endblock %}
