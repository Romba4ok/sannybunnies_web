{% extends 'layout.html' %}

{% block content %}
  <div class="table-responsive">
    <table class="table table-hover">
      <thead>
        <tr>
          <th>ID</th>
          <th>Пользователь</th>
          <th>Рейтинг</th>
          <th>Текст</th>
          <th>Действия</th>
        </tr>
      </thead>
      <tbody>
        {% for item in items %}
          <tr>
            <td>{{ item.id }}</td>
            <td>{{ item.userName or '-' }}</td>
            <td>{{ item.rating or '-' }}</td>
            <td>{{ item.text or '-' }}</td>
            <td>
              <div class="d-flex gap-2">
                <a href="{{ url_for('reviews.edit', review_id=item.id) }}" class="btn btn-sm btn-outline-primary">Редактировать</a>
                <form method="post" action="{{ url_for('reviews.delete', review_id=item.id) }}" class="m-0" onsubmit="return confirm('Вы уверены, что хотите удалить этот отзыв?')">
                  <button type="submit" class="btn btn-sm btn-outline-danger">Удалить</button>
                </form>
              </div>
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% endblock %}
