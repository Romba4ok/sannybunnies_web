<!doctype html>
<html lang="ru" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Редактировать отзыв</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  </head>
  <body class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="form-box">
      <h1 class="h3 text-center mb-4">Редактировать отзыв</h1>
      {% with messages = get_flashed_messages(category_filter=['error']) %}
        {% if messages %}
          <div class="alert alert-danger">{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}
      <div class="mb-3">
        <label class="form-label">Пользователь</label>
        <div class="d-flex align-items-center">
          {% if review.userPhoto %}
            <img src="{{ review.userPhoto }}" alt="Фото" class="rounded-circle me-2 review-user-photo">
          {% endif %}
          <span>{{ review.userName or 'Неизвестный' }}</span>
        </div>
      </div>
      <form method="post" action="{{ url_for('reviews.edit', review_id=review.id) }}">
        <div class="mb-3">
          <label for="rating" class="form-label">Рейтинг</label>
          <select class="form-select" id="rating" name="rating" required>
            <option value="1" {% if review.rating == 1 %}selected{% endif %}>1</option>
            <option value="2" {% if review.rating == 2 %}selected{% endif %}>2</option>
            <option value="3" {% if review.rating == 3 %}selected{% endif %}>3</option>
            <option value="4" {% if review.rating == 4 %}selected{% endif %}>4</option>
            <option value="5" {% if review.rating == 5 %}selected{% endif %}>5</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="text" class="form-label">Текст отзыва</label>
          <textarea class="form-control" id="text" name="text" rows="4" required>{{ review.text }}</textarea>
        </div>
        <div class="d-flex gap-2 justify-content-end">
          <a href="{{ url_for('reviews.index') }}" class="btn btn-secondary">Отмена</a>
          <button type="submit" class="btn btn-primary">Сохранить</button>
        </div>
      </form>
    </div>
  </body>
</html>
