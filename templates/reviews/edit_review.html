<!doctype html>
<html lang="ru" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Редактировать отзыв</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <style>
      :root {
        --bs-body-bg: #09090d;
        --bs-body-color: #efe8ff;
        --bs-primary: #9d6fff;
        --bs-border-color: rgba(145, 95, 255, 0.18);
      }
      body { font-family: Inter, Arial, sans-serif; background: #09090d; color: #efe8ff; }
      .form-box { max-width: 540px; width: min(100%, 540px); background: #12101f; border: 1px solid var(--bs-border-color); border-radius: 24px; padding: 32px; box-shadow: 0 24px 70px rgba(0, 0, 0, 0.25); margin: 32px auto; }
      .form-control, .form-select { background: #10101a; color: #f5efff; border: 1px solid var(--bs-border-color); }
      .form-control:focus, .form-select:focus { border-color: var(--bs-primary); box-shadow: 0 0 0 0.2rem rgba(157, 111, 255, 0.25); }
      .btn-primary { background: #2f2f4a; border-color: rgba(145, 95, 255, 0.22); }
      .btn-primary:hover { background: #45466f; }
      .form-text { color: #b8b0d3; }
      .text-muted { color: #b8b0d3 !important; }
    </style>
  </head>
  <body class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="form-box">
      <h1 class="h3 text-center mb-4">Редактировать отзыв</h1>
      {% with messages = get_flashed_messages(category_filter=['error']) %}
        {% if messages %}
          <div class="alert alert-danger">{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}
      <div class="mb-3">
        <label class="form-label">Пользователь</label>
        <div class="d-flex align-items-center">
          {% if review.userPhoto %}
            <img src="{{ review.userPhoto }}" alt="Фото" class="rounded-circle me-2" style="width: 40px; height: 40px;">
          {% endif %}
          <span>{{ review.userName or 'Неизвестный' }}</span>
        </div>
      </div>
      <form method="post" action="{{ url_for('reviews.edit', review_id=review.id) }}">
        <div class="mb-3">
          <label for="rating" class="form-label">Рейтинг</label>
          <select class="form-select" id="rating" name="rating" required>
            <option value="1" {% if review.rating == 1 %}selected{% endif %}>1</option>
            <option value="2" {% if review.rating == 2 %}selected{% endif %}>2</option>
            <option value="3" {% if review.rating == 3 %}selected{% endif %}>3</option>
            <option value="4" {% if review.rating == 4 %}selected{% endif %}>4</option>
            <option value="5" {% if review.rating == 5 %}selected{% endif %}>5</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="text" class="form-label">Текст отзыва</label>
          <textarea class="form-control" id="text" name="text" rows="4" required>{{ review.text }}</textarea>
        </div>
        <div class="d-flex gap-2 justify-content-end">
          <a href="{{ url_for('reviews.index') }}" class="btn btn-secondary">Отмена</a>
          <button type="submit" class="btn btn-primary">Сохранить</button>
        </div>
      </form>
    </div>
  </body>
</html>
