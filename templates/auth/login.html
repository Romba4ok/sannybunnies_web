<!doctype html>
<html lang="ru" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вход в админ панель</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <style>
      :root {
        --bs-body-bg: #09090d;
        --bs-body-color: #f2ecff;
        --bs-primary: #9d6fff;
        --bs-border-color: rgba(145, 95, 255, 0.18);
      }
      body { font-family: Inter, Arial, sans-serif; }
      .login-box { max-width: 400px; background: #100f1e; border: 1px solid var(--bs-border-color); border-radius: 24px; padding: 36px; box-shadow: 0 24px 60px rgba(18, 8, 40, 0.35); }
      .form-control { background: #11101b; color: #f6efff; border: 1px solid var(--bs-border-color); }
      .form-control:focus { border-color: var(--bs-primary); box-shadow: 0 0 0 0.2rem rgba(157, 111, 255, 0.25); }
      .btn { border-radius: 14px; font-weight: 700; }
      .btn-primary { background: #332f57; border-color: rgba(145, 95, 255, 0.22); }
      .btn-primary:hover { background: #4a4579; }
      .alert { color: #f8b6ff; }
    </style>
  </head>
  <body class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="login-box">
      <h1 class="text-center mb-4">Админ вход</h1>
      <p class="text-muted text-center mb-4">Авторизация по Firebase. Только пользователи с ролью <strong class="text-light">admin</strong>.</p>
      {% with messages = get_flashed_messages(category_filter=['error']) %}
        {% if messages %}
          <div class="alert alert-danger">{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}
      <form method="post">
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" name="email" required autocomplete="username" />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Пароль</label>
          <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary w-100">Войти</button>
      </form>
    </div>
  </body>
</html>
