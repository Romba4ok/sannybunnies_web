<!doctype html>
<html lang="ru" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Добавить группу</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
        <style>
      :root {
        --bs-body-bg: #09090d;
        --bs-body-color: #efe8ff;
        --bs-border-color: rgba(145, 95, 255, 0.18);
      }
      body { font-family: Inter, Arial, sans-serif; background: #09090d; color: #efe8ff; }
      .form-box { max-width: 540px; width: min(100%, 540px); background: #12101f; border: 1px solid var(--bs-border-color); border-radius: 24px; padding: 32px; box-shadow: 0 24px 70px rgba(0, 0, 0, 0.25); margin: 32px auto; }
      .form-control, .form-select { background: #10101a; color: #f5efff; border: 1px solid var(--bs-border-color); }
      .form-control:focus, .form-select:focus { border-color: #9d6fff; box-shadow: 0 0 0 0.2rem rgba(157, 111, 255, 0.25); }
      .btn-primary { background: #2f2f4a; border-color: rgba(145, 95, 255, 0.22); }
      .btn-primary:hover { background: #45466f; }
      .text-muted { color: #b8b0d3 !important; }
    </style>
  </head>
  <body>
    <div class="form-box">
      <h1 class="h3 text-center mb-4">Добавить группу</h1>
      {% with messages = get_flashed_messages(category_filter=['error']) %}
        {% if messages %}
          <div class="alert alert-danger">{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}
      <form method="post" action="{{ url_for('groups.add') }}">
        <div class="mb-3">
          <label for="name" class="form-label">Название группы</label>
          <input type="text" class="form-control" id="name" name="name" placeholder="Название" required />
        </div>
        <div class="row g-3 mb-3">
          <div class="col-6">
            <label for="age_from" class="form-label">Возраст от</label>
            <input type="number" min="0" class="form-control" id="age_from" name="age_from" placeholder="От" />
          </div>
          <div class="col-6">
            <label for="age_to" class="form-label">Возраст до</label>
            <input type="number" min="0" class="form-control" id="age_to" name="age_to" placeholder="До" />
          </div>
        </div>
        <div class="mb-3">
          <label for="teacher_uids" class="form-label">Воспитатель</label>
          <select class="form-select" id="teacher_uids" name="teacher_uids[]" size="6">
            {% for teacher in teachers %}
              <option value="{{ teacher.id }}">{{ teacher.name or teacher.email or teacher.id }}</option>
            {% endfor %}
          </select>
          <div class="form-text">Выберите одного воспитателя.</div>
        </div>
        <div class="mb-3">
          <label for="children_uids" class="form-label">Дети / родители</label>
          <select class="form-select" id="children_uids" name="children_uids[]" multiple size="6">
            {% for child in children %}
              <option value="{{ child.id }}">
                {% if child.parent_name and child.name %}
                  {{ child.parent_name }} / {{ child.name }}
                {% elif child.parent_name and child.child_name %}
                  {{ child.parent_name }} / {{ child.child_name }}
                {% else %}
                  {{ child.name or child.child_name or child.email or child.id }}
                {% endif %}
                {% if child.group_name %} · группа: {{ child.group_name }}{% endif %}
              </option>
            {% endfor %}
          </select>
          <div class="form-text">Выберите только ребенка; рядом выводится родитель и ребенок.</div>
        </div>
        <button type="submit" class="btn btn-primary w-100">Сохранить группу</button>
      </form>
      <div class="text-center mt-3">
        <a href="{{ url_for('groups.index') }}" class="text-decoration-none text-muted">← Назад к списку</a>
      </div>
    </div>
    <script>
      function enableClickToggle(selectId) {
        const select = document.getElementById(selectId);
        if (!select) return;
        select.addEventListener('mousedown', function (event) {
          if (event.target.tagName !== 'OPTION') return;
          event.preventDefault();
          event.target.selected = !event.target.selected;
          const changeEvent = new Event('change', { bubbles: true });
          select.dispatchEvent(changeEvent);
        });
      }
      enableClickToggle('children_uids');
    </script>
  </body>
</html>
