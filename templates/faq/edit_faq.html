<!doctype html>
<html lang="ru" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Редактировать FAQ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
        <style>
      :root {
        --bs-body-bg: #09090d;
        --bs-body-color: #efe8ff;
        --bs-primary: #9d6fff;
        --bs-border-color: rgba(145, 95, 255, 0.18);
      }
      body { font-family: Inter, Arial, sans-serif; background: #09090d; color: #efe8ff; }
      .form-box { max-width: 600px; width: min(100%, 600px); background: #12101f; border: 1px solid var(--bs-border-color); border-radius: 24px; padding: 32px; box-shadow: 0 24px 70px rgba(0, 0, 0, 0.25); margin: 32px auto; }
      .form-control, .form-select { background: #10101a; color: #f5efff; border: 1px solid var(--bs-border-color); }
      .form-control:focus, .form-select:focus { border-color: var(--bs-primary); box-shadow: 0 0 0 0.2rem rgba(157, 111, 255, 0.25); }
      .btn-primary { background: #2f2f4a; border-color: rgba(145, 95, 255, 0.22); }
      .btn-primary:hover { background: #45466f; }
      .form-text { color: #b8b0d3; }
      .text-muted { color: #b8b0d3 !important; }
    </style>
  </head>
  <body class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="form-box">
      <h1 class="h3 text-center mb-4">Редактировать FAQ</h1>
      {% with messages = get_flashed_messages(category_filter=['error']) %}
        {% if messages %}
          <div class="alert alert-danger">{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}
      <form method="post" action="{{ url_for('faq.edit', faq_id=faq.id) }}">
        <div class="mb-3">
          <label for="question" class="form-label">Вопрос</label>
          <input type="text" class="form-control" id="question" name="question" value="{{ faq.question }}" required />
        </div>
        <div class="mb-3">
          <label for="answer" class="form-label">Ответ</label>
          <textarea class="form-control" id="answer" name="answer" rows="4" required>{{ faq.answer }}</textarea>
        </div>
        <div class="d-flex gap-2 justify-content-end">
          <a href="{{ url_for('faq.index') }}" class="btn btn-secondary">Отмена</a>
          <button type="submit" class="btn btn-primary">Сохранить</button>
        </div>
      </form>
    </div>
  </body>
</html>
